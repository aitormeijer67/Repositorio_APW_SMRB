        <title>Vota al Mejor Jugador - FC Barcelona</title>

    <body>

        <h1>Vota al mejor jugador de la historia del Barça</h1>
        <p>Selecciona a tu jugador favorito de la lista y envía tu voto.</p>
        
        <hr>

        <!-- Formulario de Votación -->
        <form>
            <h3>Elige solo una opción:</h3>

            <p>
                <input type="radio" id="messi" name="mejor_jugador" value="Messi">
                <label for="messi">Leo Messi</label>
            </p>

            <p>
                <input type="radio" id="iniesta" name="mejor_jugador" value="Iniesta">
                <label for="iniesta">Andrés Iniesta</label>
            </p>

            <p>
                <input type="radio" id="xavi" name="mejor_jugador" value="Xavi">
                <label for="xavi">Xavi Hernández</label>
            </p>

            <p>
                <input type="radio" id="pique" name="mejor_jugador" value="Pique">
                <label for="pique">Gerard Piqué</label>
            </p>

            <p>
                <input type="radio" id="ronaldinho" name="mejor_jugador" value="Ronaldinho">
                <label for="ronaldinho">Ronaldinho</label>
            </p>

            <p>
                <input type="radio" id="lamine" name="mejor_jugador" value="Lamine Yamal">
                <label for="lamine">Lamine Yamal</label>
            </p>

            <p>
                <input type="radio" id="cruyff" name="mejor_jugador" value="Cruyff">
                <label for="cruyff">Johan Cruyff</label>
            </p>

            <br>
            <!-- Botón para enviar la votación -->
            <button type="submit">Enviar Voto</button>
        </form>
